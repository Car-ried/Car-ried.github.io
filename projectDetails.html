<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details – Ben Boyer</title>
    
    <!-- Meta Description for SEO -->
    <meta name="description" content="Mechanical engineering project by Ben Boyer. Explore practical examples of CAD, prototyping, testing, and hands-on design work.">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Engineering Project – Ben Boyer Portfolio" />
    <meta property="og:description" content="A mechanical engineering project by Ben Boyer. Includes CAD visuals, prototyping details, and skills used." />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://benboyer.au/projectDetails.html" />
    <meta property="og:image" content="https://benboyer.au/Assets/social-preview.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Engineering Project – Ben Boyer Portfolio" />
    <meta name="twitter:description" content="See one of Ben Boyer's mechanical engineering projects – CAD, testing, and design in action." />
    <meta name="twitter:image" content="https://benboyer.au/Assets/social-preview.jpg" />

    <!-- Import the existing portfolio styles so the page inherits the same look and feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <!-- Icon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <!-- Custom styles for the project detail page -->
    <style>
      /* The project hero section uses generous padding and centres its content.
         It borrows colours and typography from the main stylesheet so it
         automatically harmonises with the rest of the site. */
      /*
      .project-hero {
        padding: 4rem 0;
        text-align: center;
      }
      
      .project-hero img {
        width: 100%;
        max-width: 800px;
        height: auto;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px var(--shadow-colour);
      }
      */
      
      .project-hero h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
      }
      .project-hero p {
        max-width: 40em;
        margin: 0 auto 1rem auto;
        font-size: 1.125rem;
        color: var(--colour-mid);
      }

      /* Generic section styling – reuse the portfolio section heading style */
      .project-section {
        padding: 3rem 0;
        background-color: var(--colour-light);
      }
      .project-section:nth-child(even) {
        background-color: var(--colour-bg);
      }
      .project-section h2.section-heading {
        margin-bottom: 1rem;
      }
      .project-section p,
      .project-section ul {
        max-width: 60em;
        margin: 0 auto 1rem auto;
        font-size: 1rem;
        color: var(--colour-mid);
      }
      .project-section ul {
        list-style: disc;
        padding-left: 1.5rem;
      }

      /* Gallery grid to showcase additional photos or diagrams */
      .project-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1rem;
        max-width: 1000px;
        margin: 0 auto;
      }
      .project-gallery img {
        width: 100%;
        height: auto;
        border-radius: 0.375rem;
        box-shadow: 0 2px 8px var(--shadow-colour);
      }

      /* Back link styling */
      .project-back {
        text-align: center;
        margin: 2rem 0;
      }
      
      .project-gallery video {
        width: 100%;
        height: auto;
        border-radius: 0.375rem;
        box-shadow: 0 2px 8px var(--shadow-colour);
        object-fit: cover;
      }
      
      .project-status {
        display: inline-flex;
        align-items: center;
        gap: 0.5ch;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 2rem;
      }

      .project-status--complete {
        background-color: var(--colour-complete);
        color: var(--colour-dark);
      }

      .project-status--ongoing {
        background-color: var(--colour-accent-light);
        color: var(--colour-accent);
      }

      .status-icon {
        vertical-align: middle;
        flex-shrink: 0;
      }
      
      .hero__inner.project-not-found {
        justify-content: flex-start;
        align-items: center;
        text-align: center;
        flex-direction: column;
        padding: 4rem 0;
      }

      .hero__inner.project-not-found .hero__content {
        max-width: none;
      }

      .hero__inner.project-not-found .hero__image-wrapper {
        display: none;
      }

      /* Bring the back link up closer to the message when not found. */
      .hero__inner.project-not-found ~ .project-back {
        margin-top: 2rem;
      }

      /* Make the hero height adapt to its content, similar to the home page hero,
         and add padding for breathing room. */
      .project-hero.hero {
        min-height: auto;
        padding-top: 4rem;
        padding-bottom: 4rem;
      }

    </style>
  </head>
  <body>
   
    <!-- Navigation copied from the main site to ensure consistency -->
    <header class="site-header">
      <div class="container header__inner">
        <a href="index.html" class="site-logo">Ben&nbsp;Boyer</a>
         
         <!-- Hamburger toggle (hidden on large screens) -->
         <button class="hamburger" aria-label="Toggle site navigation" aria-controls="site-navigation" aria-expanded="false">
           <span class="hamburger__line"></span>
           <span class="hamburger__line"></span>
           <span class="hamburger__line"></span>
         </button>
         
         <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
          <ul class="nav-list">
            <li class="nav-item"><a href="./index.html#about" class="nav-link">About</a></li>
            <li class="nav-item"><a href="./index.html#skills" class="nav-link">Skills</a></li>
            <li class="nav-item"><a href="./index.html#projects" class="nav-link">Projects</a></li>
            <li class="nav-item"><a href="./index.html#experience" class="nav-link">Experience</a></li>
          </ul>
        </nav>
        
        <a href="./index.html#contact" class="btn btn--primary contact-btn">Contact</a>
      </div>
    </header>
    
    <main>
     
      <!-- Hero section populated by JavaScript -->
      <section class="project-hero hero">
        <div class="container hero__inner">
          <div class="hero__content">
            <h1 id="project-title" class="hero__heading"></h1>
            <p id="project-subtitle" class="hero__subheading"></p>
            <div id="statusTag" style="margin-bottom: 1.5rem;"></div>
          </div>
          <div class="hero__image-wrapper">
            <img id="project-hero-image" src="" alt="" class="hero__image" />
          </div>
        </div>
      </section>

      <!-- Overview / introduction -->
      <section class="project-section" id="overview-section">
        <div class="container">
          <h2 class="section-heading">Overview</h2>
          <p id="project-overview"></p>
        </div>
      </section>
      
      <!-- Design motivation -->
      <section class="project-section" id="motivation-section">
        <div class="container">
          <h2 class="section-heading">Design Motivation</h2>
          <p id="project-motivation"></p>
        </div>
      </section>
      
      <!-- Problem statement -->
      <section class="project-section" id="problem-section">
        <div class="container">
          <h2 class="section-heading">Problem</h2>
          <p id="project-problem"></p>
        </div>
      </section>
      
      <!-- Solution / approach -->
      <section class="project-section" id="solution-section">
        <div class="container">
          <h2 class="section-heading">Solution</h2>
          <p id="project-solution"></p>
        </div>
      </section>
      
      <!-- Skills & tools used -->
      <section class="project-section" id="skills-section">
        <div class="container">
          <h2 class="section-heading">Skills &amp; Tools Used</h2>
          <ul id="project-skills"></ul>
        </div>
      </section>
      
      <!-- Lessons learned -->
      <section class="project-section" id="lessons-section">
        <div class="container">
          <h2 class="section-heading">Lessons Learned</h2>
          <p id="project-lessons"></p>
        </div>
      </section>
      
      <!-- Optional gallery -->
      <section class="project-section" id="gallery-section">
        <div class="container">
          <h2 class="section-heading">Gallery</h2>
          <div class="project-gallery" id="project-gallery"></div>
        </div>
      </section>
      
      <!-- Back link -->
      <div class="project-back">
        <a id="back-button" class="btn btn--secondary">← Back</a>
      </div>
      
    </main>
    
    <footer class="site-footer">
      <div class="container footer__inner">
        <p>© <span id="year"></span> Ben Boyer. All rights reserved.</p>
      </div>
    </footer>
    
    <!-- Import the project data and page script -->
    <script src="project-data.js"></script>
    <script>
      // Set current year in footer
      document.getElementById('year').textContent = new Date().getFullYear();
      // Helper: parse query parameters
      function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }
      // Populate page with project data
      function populateProject() {
        const slug = getQueryParam('slug');
        const project = window.projectData && window.projectData[slug];
        if (!project) {
          // If unknown slug, show a friendly message
          document.getElementById('project-title').textContent = 'Project not found';
          document.getElementById('project-subtitle').textContent = '';
          document.getElementById('project-hero-image').style.display = 'none';
          document.getElementById('overview-section').style.display = 'none';
          document.getElementById('motivation-section').style.display = 'none';
          document.getElementById('problem-section').style.display = 'none';
          document.getElementById('solution-section').style.display = 'none';
          document.getElementById('skills-section').style.display = 'none';
          document.getElementById('lessons-section').style.display = 'none';
          document.getElementById('gallery-section').style.display = 'none';
          document.getElementById('statusTag').style.display = '';

          // Add a class to adjust layout of the hero inner container
          const heroInner = document.querySelector('.hero__inner');
          heroInner.classList.add('project-not-found');

          // Relocate the back link into the hero content for not found scenarios.
          const backContainer = document.querySelector('.project-back');
          const heroContent = heroInner.querySelector('.hero__content');
          if (backContainer && heroContent) {
            backContainer.style.margin = '2rem 0 0';
            heroContent.appendChild(backContainer);
          }
          return;
        }
        document.title = `${project.title} – Ben Boyer`;
        document.getElementById('project-title').textContent = project.title;
        document.getElementById('project-subtitle').textContent = project.subtitle || '';
        const heroImg = document.getElementById('project-hero-image');
        heroImg.src = project.heroImage;
        heroImg.alt = project.heroAlt || project.title;
        heroImg.loading = 'lazy';
        document.getElementById('project-overview').textContent = project.overview;
        document.getElementById('project-motivation').textContent = project.designMotivation;
        document.getElementById('project-problem').textContent = project.problem;
        const solutionEl = document.getElementById('project-solution');
          const solutionText = (project.solution || '').replace(/\n\n/g, '<br><br>');
          solutionEl.innerHTML = solutionText;

        document.getElementById('project-lessons').textContent = project.lessons;
        const status = (project.status || '').toLowerCase();
        const statusTag = document.createElement('span');
        statusTag.classList.add('project-status', `project-status--${status}`);
        statusTag.innerHTML =
          status === 'complete'
            ? `
              <svg class="status-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20.285 6.709a1 1 0 0 0-1.41-1.418L9 15.167l-3.875-3.875a1 1 0 1 0-1.415 1.415l4.582 4.582a1 1 0 0 0 1.415 0l10.578-10.58z"/>
              </svg>
              Completed`
            : `
              <svg class="status-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1a11 11 0 1 0 11 11A11.012 11.012 0 0 0 12 1Zm0 2a9 9 0 1 1-9 9a9 9 0 0 1 9-9Zm1 4h-2v6h6v-2h-4Z"/>
              </svg>
              Ongoing`;

        document.getElementById('project-subtitle').after(statusTag);

        // Populate skills list
        const skillsList = document.getElementById('project-skills');
        skillsList.innerHTML = '';
        if (Array.isArray(project.skills)) {
          project.skills.forEach(skill => {
            const li = document.createElement('li');
            li.textContent = skill;
            skillsList.appendChild(li);
          });
        }
        // Populate gallery
        const gallery = document.getElementById('project-gallery');
        gallery.innerHTML = '';
        if (Array.isArray(project.gallery) && project.gallery.length > 0) {
          project.gallery.forEach(mediaObj => {
            const extension = mediaObj.src.split('.').pop().toLowerCase();

            if (extension === 'mp4') {
              const video = document.createElement('video');
              video.src = mediaObj.src;
              video.setAttribute('muted', '');
              video.setAttribute('playsinline', '');
              // Add controls on hover, remove on mouseleave
              video.addEventListener('mouseenter', () => {
                video.controls = true;
              });
              video.addEventListener('mouseleave', () => {
                video.controls = false;
              });
              video.setAttribute('loop', '');
              video.setAttribute('preload', 'metadata');
              video.innerHTML = 'Your browser does not support the video tag.';
              video.style.width = '100%';
              video.style.borderRadius = '0.375rem';
              video.style.boxShadow = '0 2px 8px var(--shadow-colour)';
              gallery.appendChild(video);
            } else {
              const img = document.createElement('img');
              img.src = mediaObj.src;
              img.alt = mediaObj.alt || '';
              img.loading = 'lazy';
              gallery.appendChild(img);
            }
          });
        } else {
          // If no gallery provided, hide the section
          document.getElementById('gallery-section').style.display = 'none';
        }
      }
      
      function enableAutoplayOnView() {
        const videos = document.querySelectorAll('#project-gallery video');

        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              const video = entry.target;
              if (entry.isIntersecting) {
                video.play();
              } else {
                video.pause();
              }
            });
          }, {
            threshold: 0.5  // Adjust if needed: 0.5 = half the video visible
          });

          videos.forEach(video => observer.observe(video));
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        populateProject();

        enableAutoplayOnView();

        const fromPage = getQueryParam('from');
        const backBtn = document.getElementById('back-button');

        if (backBtn) {
          if (fromPage) {
            let backHref = fromPage;

            // Append #projects if user came from index.html
            if (fromPage === 'index.html') {
              backHref = 'index.html#projects';
            } else if (!fromPage.includes('.html')) {
              backHref = `./${fromPage}`;
            }

            backBtn.setAttribute('href', backHref);
            backBtn.textContent = '← Back';
          } else {
            backBtn.setAttribute('href', 'projects.html');
            backBtn.textContent = '← Back to all projects';
          }
        }
      });
    </script>
    <script src="script.js" defer></script>
  </body>
</html>
